[project]
name = "langchain-course"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Nadula Pathirana", email = "nadulapathirana2010@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "l>=0.11.0",
    "langchain>=1.4.7",
    "langchain-openai>=1.7.3",
    "langchain-tavily>=0.2.18",
    "langgraph>=1.2.18",
