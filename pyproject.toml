[project]
name = "langchain-course"
version = "0.1.0"
description = "LangChain course notebooks and helpers"
authors = [
    { name = "Nadula Pathirana", email = "nadulapathirana2010@gmail.com" }
]
requires-python = ">=3.11"
dependencies = [
    "beautifulsoup4",
    "black",
    "certifi",
    "fastapi",
    "firecrawl-py",
    "isort",
    "jinja2",
    "langchain-chroma",
    "langchain-community",
    "langchain-pinecone",
    "langchain-tavily",
    "langchainhub",
    "langsmith",
    "nltk",
    "openai",
    "pillow",
    "python-dotenv",
    "rich",
    "streamlit",
    "streamlit-chat",
    "tiktoken",
    "tqdm",
    "unstructured",
    "uvicorn",
]

[dependency-groups]
dev = [
    "ipykernel",
]

[tool.uv]
# onnxruntime 1.24+ only ships macOS 14+ wheels; this machine is macOS 13.
constraint-dependencies = ["onnxruntime<1.24"]

[build-system]
requires = ["uv_build>=0.12.18,<0.13.0"]
build-backend = "uv_build"
